<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94; --teal: #0091a3;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
button { font-family: var(--font-mono); }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.btn { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; padding: var(--sp-3) var(--sp-5); cursor: pointer; border: 1px solid transparent; }
.btn-primary { background: var(--pink); color: #fff; }
.btn-secondary { background: transparent; border-color: var(--pink); color: var(--pink); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-secondary); }
.btn-teal { background: var(--teal); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Button</h3>
    <p class="compDesc">Primario (relleno rosa), secundario (contorno rosa), ghost (texto), variante teal, deshabilitado.</p>
  </div>
  <div class="row">
    <button class="hud btn btn-primary">Guardar</button>
    <button class="hud btn btn-secondary">Cancelar</button>
    <button class="hud btn btn-ghost">Descartar</button>
    <button class="hud btn btn-teal">Explorar</button>
    <button class="hud btn btn-primary" disabled>Enviando…</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

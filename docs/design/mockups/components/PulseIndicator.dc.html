<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94; --teal: #0091a3; --amber: #d98a12; --red: #d43a4f;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.rows { display: flex; flex-direction: column; gap: var(--sp-3); }
.pulseWrap { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: .78rem; color: var(--ink-secondary); }
.dot { width: 7px; height: 7px; border-radius: 50%; }
.blink { animation: dp 1.4s steps(1) infinite; }
@keyframes dp { 0%,49% { opacity: 1; } 50%,100% { opacity: .3; } }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">PulseIndicator</h3>
    <p class="compDesc">Punto con parpadeo `steps(1)` + etiqueta — actividad en vivo.</p>
  </div>
  <div class="rows">
    <div class="pulseWrap"><span class="dot blink" style="background:var(--pink)"></span><span class="hud">Trabajando en: Plataforma de trading</span></div>
    <div class="pulseWrap"><span class="dot blink" style="background:var(--teal)"></span><span class="hud">Aprendiendo: Docker</span></div>
    <div class="pulseWrap"><span class="dot blink" style="background:var(--amber)"></span><span class="hud">En progreso: Migración de esquema</span></div>
    <div class="pulseWrap"><span class="dot blink" style="background:var(--red)"></span><span class="hud">Alerta: Certificado expira en 3 días</span></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.rows { display: flex; flex-direction: column; gap: var(--sp-3); }
.row { display: flex; align-items: center; gap: var(--sp-3); font-family: var(--font-sans); font-size: .9rem; }
.box { width: 18px; height: 18px; border: 1px solid var(--line); background: var(--bg-panel); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.box.checked { background: var(--pink); border-color: var(--pink); }
.box svg { width: 12px; height: 12px; }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Checkbox</h3>
    <p class="compDesc">Casilla cuadrada (coherente con los bordes rectos del sistema, sin `border-radius`).</p>
  </div>
  <div class="rows">
    <div class="row"><span class="box checked"><svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2"><path d="M2 6l3 3 5-6"/></svg></span> Notificarme por email</div>
    <div class="row"><span class="box"></span> Suscribirme a la newsletter</div>
    <div class="row" style="color:var(--ink-secondary)"><span class="box" style="opacity:.5"></span> Opción deshabilitada</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

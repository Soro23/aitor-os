<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94; --teal: #0091a3; --amber: #d98a12; --green: #1a9e6b;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
a { color: inherit; text-decoration: none; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }

.wrapper { border: 1px solid var(--line); background: var(--bg-panel); }
.table { width: 100%; border-collapse: collapse; }
.th { text-align: left; padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line); color: var(--ink-secondary); font-size: .68rem; }
.td { padding: var(--sp-3) var(--sp-4); font-family: var(--font-sans); font-size: .85rem; border-bottom: 1px solid var(--line); }
tr:last-child .td { border-bottom: none; }
.status { display: inline-flex; align-items: center; font-size: .65rem; text-transform: uppercase; padding: 2px var(--sp-2); border: 1px solid var(--line); }
.status::before { content: "▮"; margin-right: 3px; }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">DataTable</h3>
    <p class="compDesc">Tabla genérica tipada (columnas + filas) para listados del panel admin.</p>
  </div>
  <div class="wrapper">
    <table class="table">
      <thead><tr>
        <th class="hud th">Nombre</th><th class="hud th">Estado</th><th class="hud th">Actualizado</th>
      </tr></thead>
      <tbody>
        <tr><td class="td">Trading Platform</td><td class="td"><span class="status" style="color:var(--amber)">En desarrollo</span></td><td class="td">hace 2 días</td></tr>
        <tr><td class="td">Homelab</td><td class="td"><span class="status" style="color:var(--green)">Finalizado</span></td><td class="td">hace 3 semanas</td></tr>
        <tr><td class="td">Active Directory</td><td class="td"><span class="status" style="color:var(--teal)">Growing</span></td><td class="td">hace 5 horas</td></tr>
      </tbody>
    </table>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

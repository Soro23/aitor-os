<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94; --teal: #0091a3;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; position: relative; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
button { font-family: var(--font-mono); }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.backdrop { background: rgba(28,20,32,.35); padding: var(--sp-6); display: flex; align-items: center; justify-content: center; }
.dialog { position: relative; background: var(--bg-panel); border: 1px solid var(--line); padding: var(--sp-5) var(--sp-5) var(--sp-5) calc(var(--sp-5) + 30px); overflow: hidden; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(28,20,32,.2); }
.sideBar { position: absolute; top: 0; bottom: 0; left: 0; width: 26px; background: linear-gradient(180deg, var(--pink), var(--teal)); display: flex; align-items: center; justify-content: center; }
.sideBar span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: .6rem; letter-spacing: .18em; color: #fff; font-weight: 700; }
.dTitle { font-family: var(--font-sans); font-size: 1.15rem; font-weight: 800; margin: 0 0 var(--sp-3); }
.dBody { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .85rem; margin-bottom: var(--sp-4); }
.actions { display: flex; justify-content: flex-end; gap: var(--sp-3); }
.btn { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; padding: var(--sp-2) var(--sp-4); cursor: pointer; border: 1px solid transparent; }
.btn-primary { background: var(--pink); color: #fff; }
.btn-ghost { background: transparent; color: var(--ink-secondary); }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Modal / Dialog</h3>
    <p class="compDesc">Barra lateral de identidad + backdrop translúcido. Mismo panel que ClipCard, en overlay.</p>
  </div>
  <div class="backdrop">
    <div class="dialog">
      <span class="sideBar"><span>CONFIRM</span></span>
      <h3 class="dTitle">¿Eliminar experimento?</h3>
      <p class="dBody">Esta acción no se puede deshacer. LAB #009 se borrará permanentemente.</p>
      <div class="actions">
        <button class="hud btn btn-ghost">Cancelar</button>
        <button class="hud btn btn-primary">Eliminar</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

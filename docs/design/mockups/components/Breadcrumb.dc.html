<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --pink: #ff4d94;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-2: .5rem; --sp-3: .75rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.crumbs { display: flex; align-items: center; gap: var(--sp-2); font-size: .72rem; }
.crumb { color: var(--ink-secondary); }
.crumb.current { color: var(--pink); }
.sep { color: var(--ink-secondary); opacity: .5; }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Breadcrumb</h3>
    <p class="compDesc">Mono, mayúsculas, separador `/` — el nivel actual en rosa.</p>
  </div>
  <div class="crumbs hud">
    <span class="crumb">Inicio</span><span class="sep">/</span>
    <span class="crumb">Proyectos</span><span class="sep">/</span>
    <span class="crumb current">Trading Platform</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

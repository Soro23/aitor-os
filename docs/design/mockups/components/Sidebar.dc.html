<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.side { width: 220px; background: var(--bg-panel); border: 1px solid var(--line); padding: var(--sp-4) 0; }
.entry { padding: var(--sp-3) var(--sp-4); font-size: .78rem; color: var(--ink-secondary); border-left: 3px solid transparent; }
.entry.active { color: var(--pink); border-left-color: var(--pink); background: rgba(255,77,148,.06); }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Sidebar</h3>
    <p class="compDesc">Navegación admin vertical — borde izquierdo rosa marca el ítem activo (única excepción al patrón "barra lateral ancha").</p>
  </div>
  <nav class="side hud">
    <div class="entry active">Proyectos</div>
    <div class="entry">Digital Garden</div>
    <div class="entry">Lab</div>
    <div class="entry">Recursos</div>
    <div class="entry">Now</div>
    <div class="entry">Stack</div>
    <div class="entry">Mensajes</div>
  </nav>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

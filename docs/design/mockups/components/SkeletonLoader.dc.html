<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.card { border: 1px solid var(--line); background: #fff; padding: var(--sp-4); max-width: 320px; display: flex; flex-direction: column; gap: var(--sp-3); }
.bone { background: linear-gradient(90deg, #f0e4e8 25%, #f8eef1 37%, #f0e4e8 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; height: 12px; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
.bone.w60 { width: 60%; } .bone.w40 { width: 40%; } .bone.h24 { height: 24px; }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Skeleton loader</h3>
    <p class="compDesc">Bloques con shimmer rosa pálido — silueta de una ClipCard mientras carga.</p>
  </div>
  <div class="card">
    <div class="bone w40"></div>
    <div class="bone h24 w60"></div>
    <div class="bone"></div>
    <div class="bone w60"></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

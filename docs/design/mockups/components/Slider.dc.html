<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-2: .5rem; --sp-3: .75rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-6); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.field { display: flex; flex-direction: column; gap: var(--sp-3); }
.labelRow { display: flex; justify-content: space-between; font-size: .7rem; color: var(--ink-secondary); }
.track { position: relative; height: 4px; background: var(--line); }
.fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pink); }
.thumb { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--pink); transform: translate(-50%,-50%); }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Slider</h3>
    <p class="compDesc">Track fino con relleno rosa; el pulgar es la única otra forma redonda del sistema junto al radio button.</p>
  </div>
  <div class="field">
    <div class="labelRow hud"><span>Presupuesto</span><span>65%</span></div>
    <div class="track"><div class="fill" style="width:65%"></div><div class="thumb" style="left:65%"></div></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

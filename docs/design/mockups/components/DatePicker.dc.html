<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.cal { background: var(--bg-panel); border: 1px solid var(--line); padding: var(--sp-4); width: 260px; }
.calHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); font-family: var(--font-sans); font-weight: 700; font-size: .82rem; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.dow { font-size: .6rem; color: var(--ink-secondary); padding-bottom: var(--sp-2); }
.day { font-family: var(--font-sans); font-size: .78rem; padding: var(--sp-2) 0; color: var(--ink); }
.day.muted { color: var(--line); }
.day.selected { background: var(--pink); color: #fff; }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Date picker</h3>
    <p class="compDesc">Calendario cuadrado, sin esquinas redondeadas — el día seleccionado se resuelve como relleno rosa sólido.</p>
  </div>
  <div class="cal">
    <div class="calHead"><span>‹</span><span>Marzo 2026</span><span>›</span></div>
    <div class="grid">
      <span class="hud dow">L</span><span class="hud dow">M</span><span class="hud dow">X</span><span class="hud dow">J</span><span class="hud dow">V</span><span class="hud dow">S</span><span class="hud dow">D</span>
      <span class="day muted">23</span><span class="day muted">24</span><span class="day">1</span><span class="day">2</span><span class="day">3</span><span class="day">4</span><span class="day">5</span>
      <span class="day">6</span><span class="day">7</span><span class="day">8</span><span class="day">9</span><span class="day">10</span><span class="day">11</span><span class="day">12</span>
      <span class="day">13</span><span class="day">14</span><span class="day">15</span><span class="day">16</span><span class="day selected">17</span><span class="day">18</span><span class="day">19</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-1: .25rem; --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.tabList { display: flex; gap: var(--sp-5); border-bottom: 1px solid var(--line); }
.tab { padding-bottom: var(--sp-3); font-size: .78rem; color: var(--ink-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.active { color: var(--pink); border-bottom-color: var(--pink); }
.tabBody { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .85rem; padding-top: var(--sp-2); }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Tabs</h3>
    <p class="compDesc">Línea inferior rosa en la pestaña activa, sin fondo ni borde alrededor.</p>
  </div>
  <div>
    <div class="tabList">
      <span class="hud tab active">Resumen</span>
      <span class="hud tab">Actividad</span>
      <span class="hud tab">Configuración</span>
    </div>
    <p class="tabBody">Contenido de la pestaña "Resumen" — estado, progreso y últimos cambios del proyecto.</p>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

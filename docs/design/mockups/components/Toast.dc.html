<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #fbeef2; --bg-panel: #ffffff;
  --ink: #1c1420; --ink-secondary: #8a7280;
  --line: #f0d3dc;
  --pink: #ff4d94; --green: #1a9e6b;
  --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
  --sp-2: .5rem; --sp-3: .75rem; --sp-4: 1rem; --sp-5: 1.5rem; --sp-6: 2rem;
}
* , *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-mono); font-size: 1rem; line-height: 1.5; }
p { margin: 0; } h3 { margin: 0; font-weight: 700; }
.hud { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .12em; }
.sheet { padding: var(--sp-6); display: flex; flex-direction: column; gap: var(--sp-5); }
.compName { color: var(--pink); font-size: .95rem; }
.compDesc { font-family: var(--font-sans); color: var(--ink-secondary); font-size: .8rem; }
.stage { background: rgba(28,20,32,.04); border: 1px dashed var(--line); padding: var(--sp-6); display: flex; justify-content: flex-end; }
.toast { position: relative; background: var(--ink); color: #fff; padding: var(--sp-3) var(--sp-4); display: flex; align-items: center; gap: var(--sp-3); box-shadow: 0 12px 24px rgba(28,20,32,.25); max-width: 320px; }
.toast::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--green); }
.txt { font-family: var(--font-sans); font-size: .82rem; }
.close { margin-left: auto; color: rgba(255,255,255,.5); font-size: .8rem; cursor: pointer; }
</style>
</helmet>
<div class="sheet">
  <div>
    <h3 class="hud compName">Toast / Notification</h3>
    <p class="compDesc">Fondo oscuro sólido (única superficie oscura del sistema claro) — franja de color a la izquierda, esquina inferior derecha.</p>
  </div>
  <div class="stage">
    <div class="toast">
      <span class="txt">Mensaje enviado. Gracias por escribir.</span>
      <span class="close">✕</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

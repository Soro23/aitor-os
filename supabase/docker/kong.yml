# Config declarativa de Kong (api gateway) para el stack de
# supabase/docker-compose.yml. Rutas minimas: auth, rest, storage —
# ARCHITECTURE.md no incluye Realtime/Edge Functions, así que no se
# enrutan aqui. VERIFICAR contra la documentacion oficial de Supabase
# self-hosting antes de desplegar (ver aviso en docker-compose.yml).
_format_version: "2.1"

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1

  - name: storage-v1
    url: http://storage:5000
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1

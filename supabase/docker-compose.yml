# Stack Supabase self-hosted de referencia para produccion (recurso
# "Supabase" en Coolify — ver ARCHITECTURE.md §5). Cubre exactamente los
# servicios que documenta ARCHITECTURE.md: Postgres, GoTrue (auth),
# PostgREST (rest), Storage, Kong (api gateway) y Studio.
#
# ADVERTENCIA: escrito a mano a partir de la topologia estandar de
# self-hosting de Supabase (docs.supabase.com/guides/self-hosting/docker).
# Esta maquina de desarrollo no tiene Docker, así que este archivo NO se ha
# podido probar ni una vez. Antes de desplegar en Coolify: verificar tags de
# imagen actuales, variables de entorno y kong.yml contra la documentacion
# oficial de Supabase self-hosting.
#
# Variables esperadas en un .env junto a este archivo (nunca versionado):
#   POSTGRES_PASSWORD, JWT_SECRET, ANON_KEY, SERVICE_ROLE_KEY, SITE_URL

name: aitor-os-supabase

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - supabase

  auth:
    image: supabase/gotrue:v2.170.0
    restart: unless-stopped
    depends_on:
      - db
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      # gotrue lee esta clave SIN el prefijo GOTRUE_ (verificado contra el
      # supabase-auth de referencia en Coolify, que la expone tal cual).
      API_EXTERNAL_URL: ${SITE_URL}
      # Registro publico desactivado (single-admin) — ver aitor-os-security-rules.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
    networks:
      - supabase

  rest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - supabase

  storage:
    image: supabase/storage-api:v1.19.3
    restart: unless-stopped
    depends_on:
      - db
      - rest
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_JWT_SECRET: ${JWT_SECRET}
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: aitor-os
      REGION: local
      GLOBAL_S3_BUCKET: stub
    volumes:
      - storage-data:/var/lib/storage
    networks:
      - supabase

  meta:
    image: supabase/postgres-meta:v0.87.1
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - supabase

  studio:
    image: supabase/studio:20241202-71e5240
    restart: unless-stopped
    depends_on:
      - meta
      - rest
    environment:
      SUPABASE_URL: http://kong:800
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      STUDIO_PG_META_URL: http://meta:8080
    networks:
      - supabase
    # No expuesto en la red publica de Coolify — ver ARCHITECTURE.md §5:
    # "Studio no se expone publicamente sin proteccion adicional".

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - storage
    ports:
      - "8005:8000"
      - "8445:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_PLUGINS: request-transformer,cors
    volumes:
      # Ruta relativa a la raiz del repo, no a este directorio: Coolify
      # (base_directory=/supabase) resuelve los bind mounts del compose
      # contra el checkout completo del repo, no contra supabase/.
      - ./supabase/docker/kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - supabase

networks:
  supabase:
    name: aitor-os-supabase

volumes:
  db-data:
  storage-data:
